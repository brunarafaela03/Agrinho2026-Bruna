<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Agro Forte, futuro sustentável!</title>
</head>

<body>
    <header class="cabecalho">
        <h1 class="cabecalho-titulo-principal"> Agro Forte e Sustentável</h1>
        <div class="cabecalho-div-lista">
            <ul>
                <li class="cabecalho-item-lista">O problema</li>
                <li class="cabecalho-item-lista">Nossa solução</li>
                <li class="cabecalho-item-lista">Próxima geração</li>
            </ul>
        </div>
        <div class="cabecalho-div-inversao">
            <button class="cabecalho-titulo-botao">inversão de cores 🌓</button>
        </div>
    </header>
    <main class="conteudo-principal">
        <section class="conteudo-secao-sustentavel">
            <div class="conteudo-sustentavel-texto">
                <h1 class="conteudo-sustentavel-texto-titulo">Agro é
                    forte e o futuro é <span>sustentavel</span>
                </h1>
                <p class="conteudo-sustentavel-paragrafo">
                            Como a tecnologia e a intelegência
                            artificial estão salvando o planeta e
                            otimizando a produção de alimentos.
                </p>
                <a href="#" class="sustentavel-botao">Conhecer Solução

                </a>
            </div>
            <div class="conteudo-sustentavel-imagem">
                <img src="image.png" alt="" class="sustentavel-imagem">
                        
            </div>
        </section>


    </main>
</body>

</html>
